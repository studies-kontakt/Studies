<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt - Studies Umzüge</title>
<link rel="icon" href="../Img/Logo.png" type="image/png"><link rel="stylesheet" href="../styles/Kopzeile.css"><link rel="stylesheet" href="../styles/footer.css">
<link rel="stylesheet" href="../fonts/roboto-condensed.css">



<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {
  font-family:'Roboto Condensed', sans-serif;
  background:#f4f6f8;color:#333;line-height:1.5;
}
a {text-decoration:none;color:inherit;}

@media(max-width:768px){
  .left-logo img {height:60px;}
  .center-logo img {height:55px;}
}

/* CONTENT */
.center-content {
  margin-top:140px;padding:20px;text-align:center;
}

h2 {color:#0077cc;margin-bottom:12px;}
p {margin-bottom:20px;}

.form-container {
  background:white;padding:25px;border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.06);
  text-align:left;max-width:650px;margin:0 auto;
}

.label-group {
  margin-bottom:15px;padding:12px;
  background:#f7f9fc;border-radius:8px;
}

.label-group strong {
  color:#0077cc;display:block;margin-bottom:5px;
}

.moebel-list {
  background:#fff;padding:10px;border-radius:8px;
  margin-top:8px;
}

.moebel-item {
  padding:8px;font-size:14px;
  border-left:3px solid #0077cc;
  margin-bottom:6px;
  background:#f9fbfd;
  border-radius:4px;
}

.moebel-item:last-child {
  margin-bottom:0;
}

label {
  display:block;font-weight:600;margin-bottom:6px;
  margin-top:15px;
}

input[type=text],
input[type=email],
input[type=tel] {
  width:100%;padding:12px;border:1px solid #ccc;
  border-radius:10px;font-size:16px;margin-bottom:16px;
  outline:none;transition:0.2s;
}

input:focus {
  border-color:#0077cc;
  box-shadow:0 0 5px rgba(0,119,204,0.3);
}

button {
  width:100%;padding:14px;font-size:18px;font-weight:600;
  color:white;
  background:linear-gradient(90deg,#0077cc,#00aaff);
  border:none;border-radius:12px;cursor:pointer;
  transition:0.3s;margin-top:10px;
}

button:hover {
  background:linear-gradient(90deg,#005fa3,#0099dd);
}

button:active {
  transform:scale(0.97);
}

button:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

.price-highlight {
  background:#e0f0ff;padding:15px;
  border-radius:10px;text-align:center;
  font-size:20px;font-weight:600;
  color:#0077cc;margin-top:15px;
}
</style>

</head>
<body>

<!-- HEADER -->
<div class="Kopfzeile">
  <div class="left-logo">
    <a href="../index.html"><img src="../Img/Logo2.png" alt="Logo"></a>
  </div>
  <div class="center-logo">
    <a href="../index.html"><img src="../Img/Logo.png" alt="Logo Mitte"></a>
  </div>
  <div class="right-menu">
    <div class="menu-button" id="menuButton"><div></div><div></div><div></div></div>
  </div>
  <div class="nav-links" id="navLinks">
    <a class="Kopfzeile-Link" href="../index.html">Home</a>
    <a class="Kopfzeile-Link" href="Umzug.html">Umzug</a>
    <a class="Kopfzeile-Link" href="MoebelAufbau.html">Möbel Ab-/Aufbau</a>
    <a class="Kopfzeile-Link" href="Transport.html">Transport</a>
    <a class="Kopfzeile-Link" href="ÜberUns.html">Über uns</a>
  </div>
</div>

<!-- CONTENT -->
<div class="center-content">
  <h2>Kontaktdaten für Ihr Angebot</h2>
  <p>Bitte überprüfen Sie ihre Angaben und tragen Sie Ihre Kontaktdaten ein, um ein unverbindliche Angebotsanfrage für ihren Umzug zu senden</p>

  <div class="form-container">
    <div id="reviewData"></div>

    <hr style="margin:20px 0;border:none;border-top:1px solid #eee;">

    <label for="name">Name:</label>
    <input type="text" id="name" required>

    <label for="email">E-Mail:</label>
    <input type="email" id="email" required>

    <label for="telefon">Telefonnummer:</label>
    <input type="tel" id="telefon" required>

    <button id="sendBtn" onclick="sendMail()">Jetzt Angebotsanfrage senden</button>
  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-container">
    <div class="footer-section">
      <a href="Impressum.html">Impressum</a>
    </div>
    <div class="footer-section">
      <h3>Kontakt</h3>
      <p><a href="mailto:studies.kontakt@gmail.com">studies.kontakt@gmail.com</a></p>
      <p><a href="tel:+491782550568">+49 178 2550 568</a></p>
    </div>
    <div class="footer-section">
      <a href="Datenschutz.html">Datenschutz</a>
    </div>
  </div>
</footer>

<script>
// Menü
const menuButton = document.getElementById("menuButton");
const navLinks = document.getElementById("navLinks");
menuButton.onclick = () => {
  navLinks.classList.toggle("active");
  menuButton.classList.toggle("open");
};

// Daten laden
const data = JSON.parse(sessionStorage.getItem("fullReviewData") || "{}");

// Möbel-Liste
let moebelHTML = "";
if (data.moebel && data.moebel.length) {
  moebelHTML = '<div class="moebel-list">';
  data.moebel.forEach(m => {
    moebelHTML += `<div class="moebel-item">📦 ${m.art} (${m.typ}) - Anzahl: ${m.menge}</div>`;
  });
  moebelHTML += '</div>';
} else {
  moebelHTML = '<p style="color:#999;font-style:italic;">Keine Möbel angegeben</p>';
}

// Ausgabe
document.getElementById("reviewData").innerHTML = `
  ${data.aufbauAbb === "Beides" ? `
    <div class="label-group">
      <strong>Aufbau-Adresse:</strong>
      ${data.adresse1 || '-'}
    </div>
    <div class="label-group">
      <strong>Abbau-Adresse:</strong>
      ${data.adresse2 || '-'}
    </div>
  ` : `
    <div class="label-group">
      <strong>Adresse:</strong>
      ${data.adresse1 || '-'}
    </div>
  `}

  <div class="label-group">
    <strong>Auf-/Abbau:</strong><br>
    • Art: ${data.aufbauAbb || "-"}<br>
    • Aufwand: ${data.aufbauAufwand || "-"}
    ${data.aufbau_text ? `<br>• Beschreibung: ${data.aufbau_text}` : ""}
  </div>

  <div class="label-group">
    <strong>Möbel:</strong>
    ${moebelHTML}
  </div>

  <div class="label-group">
    <strong>Entfernung gesamt:</strong> ${data.entfernungGesamt || "0"} km
  </div>
  
  <div class="price-highlight">
    💰 Gesamtpreis: ${data.totalPrice || "0"} €
  </div>
`;

function escapeHTML(str) {
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

// Telegram senden
function sendMail() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const telefon = document.getElementById("telefon").value.trim();
  const btn = document.getElementById("sendBtn");

  if (!name || !email || !telefon) {
    alert("Bitte füllen Sie alle Felder aus.");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Sende...";

  const text =
`<b>🪑 Möbel-Auf/Abbau Anfrage</b>

<b>Name:</b> ${escapeHTML(name)}
<b>E-Mail:</b> ${escapeHTML(email)}
<b>Telefon:</b> ${escapeHTML(telefon)}

<b>Details:</b>
${escapeHTML(document.getElementById("reviewData").innerText)}
`;

  const photos = (data.moebel && Array.isArray(data.moebel)) 
    ? data.moebel.filter(m => m.photo).map(m => m.photo) 
    : [];

  fetch("https://studiesmoebel.studies-kontakt.workers.dev", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ text, photos })
  })
  .then(r => r.json())
  .then(res => {
    if (res && res.ok) {
      alert("✅ Anfrage wurde erfolgreich versendet!");
      sessionStorage.clear();
      window.location.href = "Tanke.html";
    } else {
      console.error("Telegram API Antwort:", res);
      alert("❌ Fehler beim Versenden. Bitte später erneut versuchen.");
      btn.disabled = false;
      btn.innerText = "Jetzt Angebotsanfrage senden";
    }
  })
  .catch(err => {
    console.error("Fehler:", err);
    alert("❌ Fehler beim Versenden. Bitte später erneut versuchen.");
    btn.disabled = false;
    btn.innerText = "Jetzt Angebotsanfrage senden";
  });
}
</script>

</body>
</html>
